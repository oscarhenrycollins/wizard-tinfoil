# Tinfoil: one app, one container. The official attestation-verifying Tinfoil SDK holds the API key; the agent
# reaches Tinfoil only through this app's box-only gateway (/v1) with a separate local token.
services:
  wizard-tinfoil:
    image: ghcr.io/humanitylabs-org/wizard-tinfoil:0.4.0
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    tmpfs: ["/tmp:rw,nosuid,size=64m,uid=1000,gid=1000"]
    environment:
      PORT: "18804"
      APP_PORT: ${APP_PORT:-18804}
      DATA_DIR: /data/private
      HOME: /data/private
      XDG_CACHE_HOME: /data/private/cache
      XDG_DATA_HOME: /data/private/share
      WIZARD_TRUSTED_HOSTS: ${WIZARD_TRUSTED_HOSTS:-}
      WIZARD_TRUSTED_ORIGINS: ${WIZARD_TRUSTED_ORIGINS:-}
      # App Manager provisions the Router's incoming grant here (or injects a mounted path).
      # Missing/invalid grants always refuse the new Router-only endpoints.
      WIZARD_GRANTS_FILE: ${WIZARD_GRANTS_FILE:-/data/private/router-grants.json}
      # The agent's dashboard: the Hermes Agent app by name, or (alongside) the host dashboard the App Manager sets.
      WIZARD_TINFOIL_HERMES_URL: ${WIZARD_TINFOIL_HERMES_URL:-http://hermes-agent:9119}
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-hermes}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-}
    volumes:
      # Named volume, not app-data: Runtipi chmods app-data on lifecycle actions; the key stays 0600 here.
      - tinfoil-private-data:/data
    x-runtipi:
      is_main: true
      internal_port: 18804
volumes:
  # Fixed name: the saved key survives updates, reinstalls and recipe changes.
  tinfoil-private-data:
    name: wizard-tinfoil-private-data
x-runtipi:
  schema_version: 2
  overrides: []
