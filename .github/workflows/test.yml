name: Provider contracts
on:
  pull_request:
  push:
    branches: [main, feat/live-transcription-router]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: npm --prefix app ci --ignore-scripts --no-audit --no-fund
      - run: python -m unittest discover -s tests -v
      - run: npm --prefix app test
      # Paid real-provider smoke is explicit/opt-in, never run from a PR.
